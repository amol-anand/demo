name: Scheduled Snapshot Publisher

on:
  schedule:
    # Run every 5 minutes
    - cron: '*/5 * * * *'
  workflow_dispatch: # Allow manual triggering

jobs:
  publish-scheduled-snapshots:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          cd .github/workflows/scheduled-publish
          npm ci

      - name: Run snapshot publisher
        env:
          HELIX_ADMIN_API_TOKEN: ${{ secrets.HELIX_ADMIN_API_TOKEN }}
        run: |
          cd .github/workflows/scheduled-publish
          node publish-snapshots.js amol-anand demo main
