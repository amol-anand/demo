<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products Catalog</title>
</head>
<body>
    <header></header>
    <main>
      <div class="header">
          <h1>Product Details</h1>
      </div>

      <div class="product-card">
          <div class="product-id">ID: {{id}}</div>
          <h2 class="product-name">{{name}}</h2>
          <p class="product-description">{{description}}</p>
          <div class="product-price">${{price}}</div>
          
          <div class="product-metadata">
              <div class="metadata-item">
                  <span class="metadata-label">Slug:</span> {{metadata.slug}}
              </div>
              <div class="metadata-item">
                  <span class="metadata-label">Category:</span> {{metadata.category}}
              </div>
              <div class="metadata-item">
                  <span class="metadata-label">Tags:</span>
                  <div class="tags">
                      {{#metadata.tags}}
                      <span class="tag">{{.}}</span>
                      {{/metadata.tags}}
                  </div>
              </div>
          </div>
          
          {{#images}}
          <div class="images">
              {{#images}}
              <img src="{{.}}" alt="{{../name}}" class="image" onerror="this.style.display='none'">
              {{/images}}
          </div>
          {{/images}}
      </div>
    </main>
    <footer></footer>
</body>
</html>
